<style>
/* Layout: one-column phone app, five-tab bottom bar, cards on a cool paper ground.
   Mastery levels carry the colour: red -> amber -> cyan -> green. */
:root{
  --bg:#F1F3FA; --surface:#FFFFFF; --surface2:#E7EAF6; --ink:#151A35; --muted:#586088; --line:#D8DDEF;
  --accent:#3345F5; --on-accent:#FFFFFF; --accent-soft:#E3E6FF;
  --lv0:#D13238; --lv1:#B36B00; --lv2:#0A7F9E; --lv3:#1B7F4E; --on-lv:#FFFFFF;
  --good:#1B7F4E; --bad:#D13238; --hl:#FFE27A; --on-hl:#151A35;
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --shadow:0 1px 2px rgba(21,26,53,.06),0 8px 24px rgba(21,26,53,.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1122; --surface:#171B33; --surface2:#20254A; --ink:#EEF0FF; --muted:#9AA3C7; --line:#2B3160;
  --accent:#8794FF; --on-accent:#0E1122; --accent-soft:#252B5C;
  --lv0:#FF7B80; --lv1:#FFB84D; --lv2:#52CCE8; --lv3:#55CF93; --on-lv:#0E1122;
  --good:#55CF93; --bad:#FF7B80; --hl:#6B5A12; --on-hl:#FFF4C2;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1122; --surface:#171B33; --surface2:#20254A; --ink:#EEF0FF; --muted:#9AA3C7; --line:#2B3160;
  --accent:#8794FF; --on-accent:#0E1122; --accent-soft:#252B5C;
  --lv0:#FF7B80; --lv1:#FFB84D; --lv2:#52CCE8; --lv3:#55CF93; --on-lv:#0E1122;
  --good:#55CF93; --bad:#FF7B80; --hl:#6B5A12; --on-hl:#FFF4C2;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:560px;margin:0 auto;padding-block:14px 104px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.brand b{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.04em}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:20px;font-weight:800}
h3{font-size:15px;font-weight:800}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.sm{min-height:38px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.fill{fill:currentColor;stroke:none}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:700}
input[type=text],input[type=number],input[type=search],input[type=time],select,textarea{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
textarea{min-height:190px;resize:vertical;font-size:14px;line-height:1.5}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:transparent}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;padding:0 6px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:transparent}
.seg.lvs button[aria-pressed=true]{background:var(--c);color:var(--on-lv)}

.lv0{--c:var(--lv0)}.lv1{--c:var(--lv1)}.lv2{--c:var(--lv2)}.lv3{--c:var(--lv3)}
.pill{display:inline-flex;align-items:center;white-space:nowrap;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 38%,transparent)}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.bar{height:10px;border-radius:999px;background:var(--surface2);overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s}
.bar.mastery i{border-radius:0;background:var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--c);margin-right:6px}

/* home */
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{position:relative;width:104px;height:104px}
.ring svg{width:104px;height:104px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .bg{stroke:var(--surface2)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .5s}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1}
.ring .mid small{font-family:var(--f-body);font-size:11px;font-weight:600;color:var(--muted)}
.streak{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1}
.streak .ic{width:30px;height:30px;color:var(--lv1)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);font-weight:600}
.week i{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.week i.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.week i .ic{width:14px;height:14px;stroke-width:3}
.week .now i{border-color:var(--ink)}
.xp{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.banner{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.chal{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.chal:first-of-type{border-top:0;padding-top:4px}
.chal .done{color:var(--good)}
.stepper{display:inline-flex;align-items:center;gap:8px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:18px}
.stepper b{min-width:2ch;text-align:center;font-family:var(--f-display);font-size:22px}

/* words */
.wgroup{margin:18px 0 8px;display:flex;align-items:baseline;justify-content:space-between}
.wlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.w{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.w-main{display:block;width:100%;text-align:left;background:none;border:0;padding:12px 14px}
.w-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.w-word{font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:-.01em}
.w-mean{color:var(--muted);font-size:14px;margin-top:2px}
.w-ex{margin-top:8px;font-size:14px;padding-left:10px;border-left:3px solid var(--line)}
mark{background:var(--hl);color:var(--on-hl);padding:0 3px;border-radius:4px}
.w-more{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}

/* add */
.preview{border:1px dashed var(--line);border-radius:12px;padding:12px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.preview code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--surface2);padding:1px 5px;border-radius:5px}
.err{color:var(--bad)}
.ok{color:var(--good)}

/* practice */
.big-word{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,9vw,40px);letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
.q{padding:22px 18px;display:flex;flex-direction:column;gap:14px}
.opt{display:block;width:100%;text-align:left;min-height:52px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.blank{display:inline-block;min-width:5.5ch;border-bottom:3px solid var(--accent);margin:0 2px;color:transparent;user-select:none}
.sent{font-size:16px;line-height:1.55}
.fb{border-radius:12px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.fb.good{background:color-mix(in srgb,var(--good) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--good) 40%,transparent)}
.fb.bad{background:color-mix(in srgb,var(--bad) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.score{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:1;letter-spacing:-.03em}

/* me */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.badge{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.badge.off{opacity:.5}
.badge .medal{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);margin-bottom:4px}
.badge.off .medal{background:var(--surface2);color:var(--muted)}
.switch{position:relative;width:52px;height:30px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;width:100%;height:100%;cursor:pointer}
.switch i{position:absolute;inset:0;border-radius:999px;background:var(--surface2);border:1px solid var(--line);transition:.2s;pointer-events:none}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:.2s}
.switch input:checked+i{background:var(--accent);border-color:transparent}
.switch input:checked+i::after{left:25px;background:var(--on-accent)}
.switch input:focus-visible+i{outline:3px solid var(--accent);outline-offset:2px}
details summary{cursor:pointer;font-weight:700;min-height:40px;display:flex;align-items:center}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.set:first-of-type{border-top:0}

/* nav + toasts */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav div{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:560px}
.nav button{background:none;border:0;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted)}
.nav button[aria-current=page]{color:var(--accent)}
.nav button.add .plus{width:42px;height:42px;border-radius:14px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin-top:-14px;box-shadow:var(--shadow)}
.nav button.add{color:var(--ink)}
.toasts{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:420px;box-shadow:var(--shadow);animation:pop .25s}
.toast.win{background:var(--accent);color:var(--on-accent)}
@keyframes pop{from{transform:translateY(8px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
(function(){
'use strict';
var KEY='vj.v1';
var LV=['Baru dipelajari','Masih dipelajari','Hampir ingat','Di luar kepala'];
var TITLES=['Pemula','Pembaca Rajin','Pemburu Kata','Penjelajah Frasa','Ahli Kosakata','Maestro Kata'];
var DAYS=['M','S','S','R','K','J','S'];
function $(s,r){return (r||document).querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36);}
function dkey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function today(){return dkey(new Date());}
function wkey(s){return String(s).toLowerCase().replace(/\s+/g,' ').trim();}
function rnd(n){return Math.floor(Math.random()*n);}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(i+1);var t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* ---------- icons ---------- */
var IC={
 home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 list:'<path d="M4 6h16M4 12h16M4 18h10"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 cards:'<rect x="3" y="7" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/>',
 user:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3"/>',
 flame:'<path d="M12 2c1 4 6 5.500 6 11a6 6 0 0 1-12 0c0-2.500 1-4 2.500-5.500C8.500 10 10 11 11 11c.500-3-.500-5 1-9z"/>',
 check:'<path d="M5 12l5 5 9-10"/>',
 bell:'<path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/>',
 book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 19V5"/>',
 star:'<path d="M12 3l2.800 5.800 6.200.9-4.500 4.400 1.100 6.200L12 17.400 6.400 20.300l1.100-6.200L3 9.700l6.200-.9z"/>'
};
function ic(n,cls){return '<svg class="ic '+(cls||'')+'" viewBox="0 0 24 24" aria-hidden="true">'+IC[n]+'</svg>';}

/* ---------- sample data (contoh) ---------- */
var SAMPLE=[
"Rigorous|Sangat ketat, teliti, atau cermat|The admissions process for West Point is at least as rigorous as for the most selective universities.",
"Winnowed|Disaring, dikurangi, atau dipilah|This pool is winnowed down to just 4,000 who succeed in getting the required nomination.",
"Admitted|Diterima masuk|...just 1,200 are admitted and enrolled.",
"Enrolled|Terdaftar secara resmi atau mulai mengikuti program|...just 1,200 are admitted and enrolled.",
"Varsity|Tim utama atau perwakilan tertinggi dari sebuah sekolah atau universitas|Nearly all the men and women who come to West Point were varsity athletes.",
"Remarkable|Luar biasa atau patut diperhatikan|What's more remarkable is that, historically, a substantial fraction of dropouts leave in their very first summer.",
"Substantial fraction|Bagian yang cukup besar atau signifikan|...a substantial fraction of dropouts leave in their very first summer.",
"Physically|Secara fisik|Physically, mentally, military, and socially.",
"Toughens|Membuat seseorang menjadi lebih kuat atau lebih tangguh|West Point toughens you.",
"As fate would have it|Sesuatu terjadi secara kebetulan atau takdir|As fate would have it, Jerry was not only the first psychologist...",
"Separate the wheat from the chaff|Memisahkan yang terbaik dari yang kurang baik|Jerry described early efforts to separate the wheat from the chaff as dramatically unsuccessful.",
"To unearth|Menemukan atau menyingkap sesuatu yang tersembunyi|This test was meant to unearth deep-seated, unconscious motives.",
"Deep-seated|Sudah mengakar kuat|This test was meant to unearth deep-seated, unconscious motives.",
"Noble deeds|Perbuatan mulia atau tindakan yang luhur|...cadets who visualized noble deeds and courageous accomplishments.",
"Sound good in principle|Terdengar bagus secara teori atau konsep dasar, namun belum tentu praktis|Like a lot of ideas that sound good in principle, this one didn't work so well.",
"Actual lives|Kehidupan nyata|...decisions the cadets made in their actual lives.",
"Devoted|Mengabdikan, mendedikasikan, atau memberikan banyak waktu dan usaha|Several more generations of psychologists devoted themselves to the attrition issue.",
"Attrition|Pengurangan jumlah atau tingkat pengunduran diri|Several more generations of psychologists devoted themselves to the attrition issue.",
"Harrowing|Sangat menyiksa, mengerikan, atau memilukan|While the rigors of his induction were not quite as harrowing as those of West Point..."
];

/* ---------- state ---------- */
var memOnly=false;
function fresh(){
  var s={v:1,seq:0,books:[],words:[],xp:0,totalAnswers:0,days:{},badges:{},flags:{},
    daily:{date:'',answers:0,correct:0,promos:0,mastered:0,fill:0,run:0,best:0,read:false,claimed:[],goalHit:false},
    settings:{remind:true,time:'19:00',goal:10,activeBook:null,lastNotified:'',dismissed:''}};
  var b={id:uid(),title:'Contoh: West Point',total:null,current:1,done:[],sample:true};
  s.books.push(b);s.settings.activeBook=b.id;
  var lv=[1,0,2,1,0,0,0,0,1,0,3,0,0,0,0,0,2,0,0];
  SAMPLE.forEach(function(l,i){var p=l.split('|');s.words.push({id:uid(),bookId:b.id,chapter:1,word:p[0],meaning:p[1],example:p.slice(2).join('|'),level:lv[i]||0,ok:0,no:0,added:++s.seq});});
  return s;
}
function load(){
  try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.books&&o.words)return o;}}catch(e){memOnly=true;}
  return fresh();
}
var S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){memOnly=true;}syncMeta();}
var U={tab:'home',chapter:'all',level:'all',q:'',open:null,manage:false,confirm:'',
  add:{title:'',chapter:'1',text:''},p:{book:null,chapter:'all',mode:'mix',size:10,focus:true},session:null,backup:'',msg:''};

function activeBook(){return S.books.find(function(b){return b.id===S.settings.activeBook;})||S.books[0]||null;}
function wordsOf(id){return S.words.filter(function(w){return w.bookId===id;});}
function chaptersOf(id){var m={};wordsOf(id).forEach(function(w){m[w.chapter]=1;});return Object.keys(m).map(Number).sort(function(a,b){return a-b;});}
function ensureDay(){var t=today();if(S.daily.date!==t){S.daily={date:t,answers:0,correct:0,promos:0,mastered:0,fill:0,run:0,best:0,read:false,claimed:[],goalHit:false};}}
function markActive(){S.days[today()]=1;}
function streak(){var d=new Date(),n=0;if(!S.days[dkey(d)])d.setDate(d.getDate()-1);while(S.days[dkey(d)]){n++;d.setDate(d.getDate()-1);}return n;}
function playerLevel(){return Math.floor(S.xp/150)+1;}
function countLv(list){var c=[0,0,0,0];list.forEach(function(w){c[w.level]++;});return c;}

/* ---------- parsing ---------- */
function parseText(text){
  var rows=[],errors=[];
  String(text||'').split(/\r?\n/).forEach(function(raw,i){
    var line=raw.trim();if(!line||line.charAt(0)==='#')return;
    var p=line.split('|').map(function(x){return x.trim();});
    if(p.length<2||!p[0]||!p[1]){errors.push({n:i+1,line:line});return;}
    rows.push({word:p[0],meaning:p[1],example:p.slice(2).join(' | ')});
  });
  return {rows:rows,errors:errors};
}
function variants(w){var a=[w.trim()],b=w.trim().replace(/^to\s+/i,'');if(b&&b!==a[0])a.push(b);return a.filter(Boolean);}
function findIn(ex,w){var l=ex.toLowerCase();for(var k=0,v=variants(w);k<v.length;k++){var i=l.indexOf(v[k].toLowerCase());if(i>=0)return [i,i+v[k].length];}return null;}
function hl(ex,w){var r=findIn(ex,w);if(!r)return esc(ex);return esc(ex.slice(0,r[0]))+'<mark>'+esc(ex.slice(r[0],r[1]))+'</mark>'+esc(ex.slice(r[1]));}
function blankOut(ex,w){var r=findIn(ex,w);if(!r)return null;return esc(ex.slice(0,r[0]))+'<span class="blank">'+esc(ex.slice(r[0],r[1]))+'</span>'+esc(ex.slice(r[1]));}
function norm(s){return String(s).toLowerCase().replace(/[.,!?;:"“”']/g,'').replace(/\s+/g,' ').trim();}
function lev(a,b){var m=a.length,n=b.length,d=[],i,j;for(i=0;i<=m;i++){d[i]=[i];}for(j=1;j<=n;j++)d[0][j]=j;for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n];}
function checkAnswer(input,word){
  var a=norm(input),best=99;if(!a)return {ok:false};
  variants(word).forEach(function(v){var n=norm(v);var dist=lev(a,n);if(dist<best)best=dist;if(norm(v.replace(/^to\s+/i,''))===a)best=0;});
  if(best===0)return {ok:true,exact:true};
  if(best===1&&a.length>=6)return {ok:true,typo:true};
  return {ok:false};
}

/* ---------- challenges, badges ---------- */
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
var CH=[
 {id:'ans',t:'Jawab {n} soal',n:[10,15,20],get:function(d){return d.answers;}},
 {id:'cor',t:'Jawab benar {n} kali',n:[8,12],get:function(d){return d.correct;}},
 {id:'promo',t:'Naikkan {n} kata ke level berikutnya',n:[3,5],get:function(d){return d.promos;}},
 {id:'run',t:'Raih {n} jawaban benar berturut-turut',n:[4,6],get:function(d){return d.best;}},
 {id:'fill',t:'Selesaikan {n} soal isi kosong',n:[4,6],get:function(d){return d.fill;}},
 {id:'master',t:'Hafalkan {n} kata sampai di luar kepala',n:[1,2],get:function(d){return d.mastered;}}
];
function todaysChallenges(){
  var r=mulberry(hashStr(today())),pool=CH.slice(),out=[];
  for(var i=0;i<3;i++){var c=pool.splice(Math.floor(r()*pool.length),1)[0];var n=c.n[Math.floor(r()*c.n.length)];out.push({id:c.id,target:n,text:c.t.replace('{n}',n),get:c.get});}
  return out;
}

 {id:'m25',t:'Penguasa Kosakata',d:'Hafalkan 25 kata',ok:function(){return countLv(S.words)[3]>=25;}},
 {id:'a100',t:'Seratus Jawaban',d:'Jawab 100 soal',ok:function(){return S.totalAnswers>=100;}},
 {id:'s3',t:'Tiga Hari',d:'Streak 3 hari',ok:function(){return streak()>=3;}},
 {id:'s7',t:'Seminggu Penuh',d:'Streak 7 hari',ok:function(){return streak()>=7;}},
 {id:'s30',t:'Kebiasaan Baru',d:'Streak 30 hari',ok:function(){return streak()>=30;}},
 {id:'perf',t:'Tanpa Salah',d:'Satu sesi 10 soal, semua benar',ok:function(){return !!S.flags.perfect;}},
 {id:'ch1',t:'Tamat Satu Bab',d:'Tandai satu chapter selesai',ok:function(){return !!S.flags.chapterDone;}}
];
function checkProgress(){
  ensureDay();var d=S.daily,msgs=[];
  todaysChallenges().forEach(function(c){if(c.get(d)>=c.target&&d.claimed.indexOf(c.id)<0){d.claimed.push(c.id);S.xp+=30;msgs.push('Tantangan selesai: '+c.text+' (+30 XP)');}});
  if(!d.goalHit&&d.answers>=S.settings.goal){d.goalHit=true;S.xp+=20;msgs.push('Target harian tercapai (+20 XP)');}
  BADGES.forEach(function(b){if(!S.badges[b.id]&&b.ok()){S.badges[b.id]=today();msgs.push('Lencana baru: '+b.t);}});
  msgs.forEach(function(m,i){setTimeout(function(){toast(m,'win');},i*750);});
}

/* ---------- toast ---------- */
function toast(msg,kind){
  var el=document.createElement('div');el.className='toast '+(kind||'');el.textContent=msg;
  var box=$('#toasts');box.appendChild(el);setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},3400);
}
function copyText(t,okMsg){
  function fb(){try{var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();var ok=document.execCommand('copy');document.body.removeChild(ta);toast(ok?okMsg:'Salin manual dari kotak teks');return ok;}catch(e){toast('Salin manual dari kotak teks');return false;}}
  try{navigator.clipboard.writeText(t).then(function(){toast(okMsg);},fb);}catch(e){fb();}
}

 function(c){return {t:'Waktunya baca',b:'Lanjutkan '+c.book+', chapter '+c.ch+'. Sepuluh menit saja sudah cukup.'};},
 function(c){return {t:'Streak '+c.streak+' hari',b:'Jangan putus hari ini. Satu sesi latihan singkat sudah menjaganya.'};},

function ctx(){var b=activeBook();return {book:b?b.title:'bukumu',ch:b?b.current:1,streak:streak(),due:b?wordsOf(b.id).filter(function(w){return w.level<3;}).length:0};}
function reminderMsg(){var i=hashStr(today())%MSGS.length;return MSGS[i](ctx());}
function reminderDue(){
  if(!S.settings.remind)return false;
  var p=S.settings.time.split(':').map(Number),due=new Date();due.setHours(p[0]||0,p[1]||0,0,0);
  return new Date()>=due&&!S.days[today()];
}
function notifState(){try{if(!('Notification' in window))return 'unsupported';return Notification.permission;}catch(e){return 'unsupported';}}
function sysNotify(title,body){
  try{
    if(notifState()!=='granted')return Promise.resolve(false);
    var p=(navigator.serviceWorker&&navigator.serviceWorker.getRegistration)?navigator.serviceWorker.getRegistration():Promise.resolve(null);
    return p.then(function(reg){
      if(reg&&reg.showNotification){return reg.showNotification(title,{body:body,icon:'icon-192.png',badge:'icon-192.png',tag:'vj-daily'}).then(function(){return true;});}
      new Notification(title,{body:body});return true;
    }).catch(function(){return false;});
  }catch(e){return Promise.resolve(false);}
}
function checkReminder(){
  if(!reminderDue())return;
  if(S.settings.lastNotified!==today()){
    S.settings.lastNotified=today();var m=reminderMsg();sysNotify(m.t,m.b);save();
  }
  if(U.tab==='home'&&!U.session&&S.settings.dismissed!==today())render();
}
function syncMeta(){
  try{
    if(!('caches' in window))return;
    var keys=Object.keys(S.days).sort(),b=ctx();
    var meta={remind:S.settings.remind,time:S.settings.time,lastNotified:S.settings.lastNotified,lastActive:keys[keys.length-1]||'',streak:b.streak,book:b.book,ch:b.ch,due:b.due};
    caches.open('vj-meta').then(function(c){return c.put(new Request(new URL('vj-meta.json',location.href).href),new Response(JSON.stringify(meta)));}).catch(function(){});
  }catch(e){}
}

/* ---------- answer engine ---------- */
function applyAnswer(w,o){
  ensureDay();var old=w.level,lvBefore=playerLevel();
  w.level=o.newLevel;w.last=Date.now();if(o.correct)w.ok=(w.ok||0)+1;else w.no=(w.no||0)+1;
  var d=S.daily;d.answers++;S.totalAnswers++;
  if(o.correct){d.correct++;d.run++;if(d.run>d.best)d.best=d.run;}else d.run=0;
  if(o.newLevel>old)d.promos++;
  if(o.newLevel===3&&old<3)d.mastered++;
  if(o.kind==='fill')d.fill++;
  S.xp+=o.xp;markActive();
  var s=U.session;if(s){s.xp+=o.xp;if(o.correct)s.correct++;if(o.newLevel>old)s.promos++;}
  checkProgress();
  if(playerLevel()>lvBefore)setTimeout(function(){toast('Naik ke Level '+playerLevel()+': '+TITLES[Math.min(playerLevel()-1,TITLES.length-1)],'win');},400);
  save();
}

function weighted(list,n){
  var W=[5,3,2,1],pool=list.slice(),out=[];
  while(out.length<n&&pool.length){var tot=pool.reduce(function(a,w){return a+W[w.level];},0),r=Math.random()*tot,i=0;for(;i<pool.length;i++){r-=W[pool[i].level];if(r<=0)break;}if(i>=pool.length)i=pool.length-1;out.push(pool.splice(i,1)[0]);}
  return out;
}
function startSession(){
  var p=U.p,pool=S.words.filter(function(w){return w.bookId===p.book&&(p.chapter==='all'||w.chapter===+p.chapter);});
  if(!pool.length){toast('Belum ada kata di pilihan ini');return;}
  var focus=p.focus?pool.filter(function(w){return w.level<3;}):pool;if(focus.length<Math.min(p.size,4))focus=pool;
  var picked=weighted(focus,p.size),all=wordsOf(p.book);
  var items=picked.map(function(w){
    var m=p.mode;if(m==='mix')m=['flash','mc','fill'][rnd(3)];
    var it={id:w.id,mode:m};
    if(m==='mc'){
      var seenM={};seenM[wkey(w.meaning)]=1;var ds=[];
      shuffle(all).forEach(function(x){if(ds.length<3&&!seenM[wkey(x.meaning)]){seenM[wkey(x.meaning)]=1;ds.push(x.meaning);}});
      if(ds.length<2){it.mode='flash';}else it.opts=shuffle([w.meaning].concat(ds));
    }
    return it;
  });
  U.session={items:items,i:0,correct:0,xp:0,promos:0,done:false,answered:0};
}

 q:function(v){U.q=v;$('#wlist').innerHTML=wordList();},
 total:function(v){var b=activeBook();if(b){b.total=parseInt(v,10)>0?parseInt(v,10):null;save();}},
 atitle:function(v){U.add.title=v;updatePreview();},
 achap:function(v){U.add.chapter=v;updatePreview();},
 atext:function(v){U.add.text=v;updatePreview();},
 pbook:function(v){U.p.book=v;U.p.chapter='all';render();},
 pchap:function(v){U.p.chapter=v;render();},
 pfocus:function(v,el){U.p.focus=el.checked;},
 remind:function(v,el){S.settings.remind=el.checked;save();},
 rtime:function(v){if(/^\d\d:\d\d$/.test(v)){S.settings.time=v;S.settings.lastNotified='';save();}},
 goal:function(v){S.settings.goal=+v;save();},
 backup:function(v){U.backup=v;}
};
document.addEventListener('click',function(e){var t=e.target.closest('[data-act]');if(!t||t.disabled)return;var f=A[t.dataset.act];if(f)f(t,e);});
function onIn(e){var t=e.target.closest('[data-in]');if(!t)return;var f=IN[t.dataset.in];if(!f)return;
  if(e.type==='input'&&!/^(q|atitle|achap|atext|backup)$/.test(t.dataset.in))return;
  if(e.type==='change'&&/^(q|atitle|achap|atext|backup)$/.test(t.dataset.in))return;
  f(t.value,t);}
document.addEventListener('input',onIn);document.addEventListener('change',onIn);
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target&&e.target.id==='ans'){e.preventDefault();A.check();}});
document.addEventListener('toggle',function(e){if(e.target&&e.target.id==='mng')U.manage=e.target.open;},true);
document.addEventListener('visibilitychange',function(){if(!document.hidden){ensureDay();checkReminder();if(U.tab==='home')render();}});

/* ---------- boot ---------- */
ensureDay();render();checkReminder();setInterval(checkReminder,30000);syncMeta();
try{
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      if('periodicSync' in reg&&navigator.permissions){navigator.permissions.query({name:'periodic-background-sync'}).then(function(st){if(st.state==='granted')reg.periodicSync.register('vj-daily',{minInterval:6*3600*1000});}).catch(function(){});}
    }).catch(function(){});
  }
}catch(e){}
window.__vj={parseText:parseText,checkAnswer:checkAnswer,findIn:findIn,streak:streak,getS:function(){return S;}};
